[workspace]
resolver = "2"
members = ["sdslot-core", "sdslot", "sdslot-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Howard M. Harte <hharte@magicandroidapps.com>"]
repository = "https://github.com/hharte/sdslot"
readme = "README.md"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
libc = "0.2"
tempfile = "3"
eframe = "0.31"
egui_extras = "0.31"
rfd = "0.15"
notify = "8"

[workspace.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
]

[profile.release]
lto = "thin"
