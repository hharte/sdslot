name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  # "published" covers both creating a release outright and publishing a
  # draft; "created" would double-fire alongside it for the common case.
  release:
    types: [published]
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run; release runs are
# never canceled and never queue behind the tag push that preceded them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgl1-mesa-dev

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The device layers and elevation paths are cfg-gated, so the host-target
  # clippy run above only ever sees a third of them. Lint the other targets
  # too — no linker needed, clippy stops before that.
  cross-lint:
    name: clippy ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

  build:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # gh release upload
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            # Sets the glibc floor for the Linux archive; pin to an older
            # runner image if the binaries need to run on older distros.
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgl1-mesa-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      # Tag builds and release assets are named by the tag; every other build
      # is named by the commit it came from, so an artifact is never ambiguous
      # about which tree produced it.
      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            ver="${{ github.event.release.tag_name }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            ver="${GITHUB_REF#refs/tags/}"
          else
            ver="$(git rev-parse --short=12 HEAD)"
          fi
          echo "version=${ver#v}" >>"$GITHUB_OUTPUT"

      - name: Package
        id: pkg
        shell: bash
        run: |
          set -eu
          stem="sdslot-${{ steps.ver.outputs.version }}-${{ matrix.name }}"
          dir="dist/$stem"
          bin="target/${{ matrix.target }}/release"
          mkdir -p "$dir"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$bin/sdslot.exe" "$bin/sdslot-gui.exe" "$dir/"
          else
            cp "$bin/sdslot" "$bin/sdslot-gui" "$dir/"
          fi
          # macOS ships the .app too: raw /dev/rdiskN access needs Full Disk
          # Access, and TCC can only grant that to a bundle with an identifier
          # and a signature. The bare binaries stay for CLI/terminal use.
          if [ "${{ runner.os }}" = "macOS" ]; then
            sdslot-gui/macos/bundle.sh --bin-dir "$bin" --out "$dir" \
              --version "${{ steps.ver.outputs.version }}"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          cp -r examples "$dir/examples"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            asset="$stem.zip"
            7z a -tzip "$asset" "$stem" >/dev/null
          else
            asset="$stem.tar.gz"
            tar czf "$asset" "$stem"
          fi
          # Checksum file references the bare archive name, so `sha256sum -c`
          # works from whatever directory the user downloaded it into.
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" >"$asset.sha256"
          else
            shasum -a 256 "$asset" >"$asset.sha256"
          fi
          echo "asset=$asset" >>"$GITHUB_OUTPUT"
          echo "stem=$stem" >>"$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.stem }}
          path: |
            dist/${{ steps.pkg.outputs.asset }}
            dist/${{ steps.pkg.outputs.asset }}.sha256
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist/${{ steps.pkg.outputs.asset }}" \
            "dist/${{ steps.pkg.outputs.asset }}.sha256" \
            --clobber
